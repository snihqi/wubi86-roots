<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>五笔字根 · 86 版 v1.0.6</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ctext x='16' y='23' font-size='19' text-anchor='middle' fill='%23fff' font-family='serif'%3E%E4%BA%94%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#F4F5F7; --card:#FFFFFF; --line:#E7E9EE; --ink:#16181D;
    --ink2:#5F6673; --ink3:#9AA1AE; --ink4:#C4C9D2;
    --ok:#16A34A; --bad:#DC2626;
    --z1:#2C5BD8; --z1b:#EEF3FD;
    --z2:#17804D; --z2b:#EAF6EF;
    --z3:#B4700F; --z3b:#FCF3E4;
    --z4:#6B3FD4; --z4b:#F2EDFC;
    --z5:#C0286B; --z5b:#FBECF3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
  }
  header{
    height:60px; flex:0 0 60px; background:#fff; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; padding:0 26px;
  }
  .brand{display:flex; align-items:center; gap:10px; font-weight:600; font-size:16px}
  .logo{
    width:28px;height:28px;border-radius:8px;background:var(--ink);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-family:"Songti SC","Source Han Serif SC",serif;font-size:16px;font-weight:700;
  }
  .hstats{display:flex;align-items:center;gap:18px;font-size:13px;color:var(--ink2)}
  .hstats b{color:var(--ink);font-weight:600}
  .rankwrap{position:relative}
  .rank{
    display:inline-flex;align-items:center;gap:6px;
    background:#F4F5F7;border:none;border-radius:99px;padding:6px 12px;
    font-size:12px;color:var(--ink);cursor:pointer;font-family:inherit;
  }
  .rank:hover{background:#ECEEF2}
  .rank svg{opacity:.5;transition:transform .15s}
  .rank[aria-expanded="true"] svg{transform:rotate(180deg)}
  .rankmenu{
    display:none;position:absolute;right:0;top:calc(100% + 8px);width:268px;
    max-height:min(440px,72vh);overflow:auto;background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:6px;z-index:60;
    box-shadow:0 4px 12px rgba(16,24,40,.06),0 18px 40px -10px rgba(16,24,40,.2);
  }
  .rankmenu.show{display:block}
  .rmhead{
    font-size:10.5px;color:var(--ink3);padding:8px 10px 6px;
    display:flex;justify-content:space-between;
  }
  .rrow{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:7px 10px;border-radius:8px;font-size:12.5px;color:var(--ink2);
  }
  .rrow .need{font-family:Inter,sans-serif;font-size:11.5px;color:var(--ink3)}
  .rrow em{font-style:normal;font-family:Inter,sans-serif;font-size:9.5px;color:var(--ink3);display:inline-block;min-width:28px}
  .rrow:hover{background:#F7F8FA}
  .rrow.cur{background:#F1F3F6;color:var(--ink);font-weight:600}
  .rrow.cur .need{color:var(--ink2);font-weight:600}
  .rrow.cur::after{content:"当前";font-size:9px;color:#fff;background:var(--ink);border-radius:99px;padding:2px 6px;margin-left:2px}
  main{
    flex:1 1 auto; min-height:0; padding:18px 26px 24px;
    display:grid; grid-template-columns:minmax(0,1fr) 296px;
    grid-template-rows:auto 1fr;
    gap:12px 20px; align-items:stretch;
  }
  .status{
    grid-column:1; grid-row:1;
    display:flex; align-items:center; gap:14px;
    font-size:13px; color:var(--ink2);
  }
  .status b{color:var(--ink); font-weight:600; font-size:15px}
  .status .bar{flex:1}
  .left{grid-column:1; grid-row:2; display:flex;flex-direction:column;gap:14px;min-height:0}
  .bar{height:6px;border-radius:99px;background:#DDE1E8;overflow:hidden;display:flex;gap:2px}
  .bar i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .25s}
  .card{
    background:#fff;border:1px solid var(--line);border-radius:18px;
    padding:24px 26px;display:flex;flex-direction:column;
    box-shadow:0 2px 10px rgba(16,24,40,.04),0 12px 28px -6px rgba(16,24,40,.05);
    min-height:336px;flex:1 1 auto;
  }
  .card.bad{border-color:#F5C9C9}
  .tagrow{display:flex;justify-content:flex-end;align-items:center}
  .hintlink{
    font-size:11px;color:var(--ink2);cursor:pointer;user-select:none;
    background:#fff;border:1px solid #E1E4EA;border-radius:99px;padding:4px 11px;
    display:inline-flex;align-items:center;gap:5px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .hintlink:hover{background:#F7F8FA;border-color:#D6DAE2;color:var(--ink)}
  .hintlink.off{color:var(--ink3);border-color:#EAEDF1}
  .hintlink i{font-style:normal;font-weight:600;color:var(--ink)}
  .hintlink.off i{color:var(--ink3)}
  .center{
    flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:10px;padding:8px 0 4px;
  }
  .char{
    display:flex;align-items:center;justify-content:center;
    height:118px;min-width:118px;
  }
  .char img.glyph{
    height:112px;width:auto;max-width:220px;display:block;
    image-rendering:auto;user-select:none;-webkit-user-drag:none;
  }
  .char img.glyph:not([src]){visibility:hidden}
  .answerline{font-size:15px;color:var(--ok);font-weight:600;height:22px}
  .mnemonic{font-size:13px;color:var(--ink3);height:18px}
  .slotrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px}
  .slot{
    width:52px;height:52px;border-radius:11px;border:1px solid #D6DAE2;background:#FBFBFC;
    display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,Menlo,monospace;font-size:22px;font-weight:600;color:var(--ink);
  }
  .slot.ok{border-color:var(--ok);background:#E9F9EF;color:var(--ok)}
  .slot.bad{border-color:#F87171;background:#FEF2F2;color:var(--bad)}
  .slothint{font-size:12px;color:var(--ink3)}
  .kb{
    background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 20px 18px;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    box-shadow:0 2px 10px rgba(16,24,40,.04),0 12px 28px -6px rgba(16,24,40,.05);
  }
  .kbrow{display:flex;gap:7px}
  .key{
    width:78px;height:58px;border-radius:10px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:1px;cursor:pointer;
    border:1px solid transparent;transition:transform .06s, box-shadow .12s;
    user-select:none;
  }
  .key span{font-size:19px;font-weight:600;font-family:Inter,ui-sans-serif,sans-serif;line-height:1.1}
  .key em{font-size:9px;font-style:normal;opacity:.72;font-family:Inter,ui-sans-serif,sans-serif}
  .key:active{transform:translateY(1px)}
  .key.z1{background:var(--z1b);color:var(--z1)}
  .key.z2{background:var(--z2b);color:var(--z2)}
  .key.z3{background:var(--z3b);color:var(--z3)}
  .key.z4{background:var(--z4b);color:var(--z4)}
  .key.z5{background:var(--z5b);color:var(--z5)}
  .key.dim{background:#F4F5F7;color:var(--ink3)}
  .key.correct{background:var(--ok)!important;color:#fff!important;box-shadow:0 0 0 3px rgba(22,163,74,.18)}
  .key.wrong{background:#FEF0F0!important;color:var(--bad)!important;border-color:#F87171!important}
  aside{grid-column:2; grid-row:2; display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
  .panel{
    background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;
    box-shadow:0 1px 6px rgba(16,24,40,.03),0 8px 20px -6px rgba(16,24,40,.04);
  }
  .ptitle{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#8A919E;margin-bottom:12px}
  .ptitle b{font-weight:500;color:var(--ink)}
  .score{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:nowrap}
  .amt{display:flex;align-items:baseline;gap:4px;flex:0 0 auto}
  .amt strong{font-size:27px;font-weight:600;font-family:Inter,sans-serif;letter-spacing:-.01em;color:var(--ink)}
  .amt em{font-style:normal;font-size:12px;color:var(--ink3)}
  .track{height:6px;border-radius:99px;background:#EDEFF3;margin:10px 0 8px;overflow:hidden}
  .rankchip{
    display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;
    border-radius:99px;padding:4px 10px;
    font-size:13px;font-weight:600;
    background:#F1F2F4;color:#5F6673;
  }
  .rankchip i{
    font-style:normal;font-family:Inter,sans-serif;font-size:10.5px;font-weight:600;
    opacity:.7;letter-spacing:.02em;
  }
  .rankchip b{font-weight:600}
  .track i{display:block;height:100%;border-radius:99px;background:var(--ink);transition:width .3s}
  .note{font-size:11px;color:var(--ink3);line-height:1.65}
  .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-size:13px;color:var(--ink2)}
  .row b{font-size:15px;font-weight:600;color:var(--ink);font-family:Inter,sans-serif}
  .row.bad b,.row.bad{color:var(--bad)}
  .row .dot{width:6px;height:6px;border-radius:99px;display:inline-block;margin-right:7px;vertical-align:middle}
  .btn{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;
    font-size:12px;color:var(--ink2);cursor:pointer;margin-top:8px;font-family:inherit;
  }
  .btn:hover{background:#F7F8FA;color:var(--ink)}
  .btn.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .row .neg{color:var(--bad)}
  .row i{font-style:normal;color:var(--ink);font-weight:600}
  .resetlink{
    width:100%;border:1px solid #EFB9B9;background:#FCE7E7;border-radius:9px;padding:8px;
    font-size:12.5px;font-weight:500;color:#B4241C;cursor:pointer;font-family:inherit;
    transition:background .15s,border-color .15s,color .15s;
  }
  .resetlink:hover{background:#F8D2D2;border-color:#E39C9C;color:#8F1A13}
  .resetlink:active{background:#F3C2C2}
  .backuprow{
    display:flex;align-items:center;justify-content:center;gap:6px;
    margin-top:-6px;                       /* 贴紧重置按钮，同时给矮窗口省出高度 */
  }
  .linkbtn{
    border:none;background:none;padding:2px 1px;font-size:11px;color:var(--ink2);
    cursor:pointer;font-family:inherit;transition:color .15s;white-space:nowrap;
  }
  .linkbtn:hover{color:var(--ink);text-decoration:underline}
  .dotsep{font-size:11px;color:var(--ink4);user-select:none}
  .signature{
    margin-top:auto;                         /* 贴到右栏最底部，当页脚用 */
    text-align:right;
    font-size:10.5px;line-height:1.45;letter-spacing:.01em;white-space:nowrap;
    color:var(--ink3);user-select:none;
  }
  .signature b{font-weight:600;color:var(--ink2);font-family:Inter,sans-serif;letter-spacing:.02em}
  .signature .by{opacity:.7}
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(10px);
    background:var(--ink);color:#fff;font-size:12px;padding:9px 16px;border-radius:99px;
    opacity:0;transition:.2s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:1180px){
    main{
      grid-template-columns:1fr;
      grid-template-rows:auto auto auto;
      align-content:start;
      overflow-y:auto;
    }
    .status{grid-column:1; grid-row:1}
    .left{grid-column:1; grid-row:2; min-height:auto}
    .card{flex:none}
    aside{grid-column:1; grid-row:3; flex-direction:row;flex-wrap:wrap;overflow:visible;min-height:auto}
    .resetlink{width:100%;text-align:center}
    aside .panel{flex:1 1 220px}
    /* 单列时右栏变成横向流，签名改成占满一行、靠右，别挤在面板中间 */
    .signature{
      width:100%;margin-top:2px;
    }
    .backuprow{width:100%;justify-content:flex-end;margin-top:0}
    .key{width:60px;height:50px}
  }
  /* 窗口偏矮时收紧右栏间距，避免多出滚动条 */
  @media (max-height:780px) and (min-width:1181px){
    aside{gap:10px}
  }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">五</div>五笔字根 · 86 版</div>
  <div class="hstats">
    <div class="rankwrap">
      <button class="rank" id="rankBtn" type="button" aria-haspopup="true" aria-expanded="false">
        <span id="hRankText">黑铁 Ⅴ</span>
        <svg viewBox="0 0 10 6" width="9" height="6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="rankmenu" id="rankMenu" role="menu"></div>
    </div>
    <span><b id="hPoints">0</b> 分</span>
    <span>连击 <b id="hCombo">0</b></span>
  </div>
</header>

<main>
  <div class="status">
    <span>已过 <b id="qPos">0</b> / 共 <b id="qTotal">236</b> 个</span>
    <div class="bar"><i id="progressBar" style="width:0%"></i></div>
    <span>打错 <b id="qWrong">0</b> 次</span>
  </div>

  <section class="left">
    <div class="card" id="card">
      <div class="tagrow">
        <div class="hintlink" id="mnemonicToggle">助记词 <i id="mnState">开</i></div>
      </div>
      <div class="center">
        <div class="char" id="char"><img class="glyph" id="glyph" alt="" draggable="false"></div>
        <div class="answerline" id="answerline"></div>
        <div class="mnemonic" id="mnemonic"></div>
        <div class="slotrow">
          <div class="slot" id="slot">_</div>
          <div class="slothint" id="slothint">按下它所在的字母键</div>
        </div>
      </div>
    </div>

    <div class="kb" id="kb"></div>
  </section>

  <aside>
    <div class="panel">
      <div class="ptitle"><b>积分 · 段位</b><span id="pct">0%</span></div>
      <div class="score">
        <span class="amt"><strong id="pPoints">0</strong><em>分</em></span>
        <span class="rankchip" id="rankChip"><i id="pLv">Lv1</i><b id="pRank">不堪一击</b></span>
      </div>
      <div class="track"><i id="pTrack" style="width:0%"></i></div>
      <div class="note" id="pNote">这一段还差 100 分</div>
    </div>

    <div class="panel">
      <div class="ptitle"><b>学习队列</b><span id="qLeft"></span></div>
      <div class="row"><span><i class="dot" style="background:#5F6673"></i>已过一遍</span><b id="sDone">0</b></div>
      <div class="row"><span><i class="dot" style="background:#B6BCC7"></i>还没打过</span><b id="sNew">0</b></div>
    </div>

    <div class="panel">
      <div class="ptitle"><b>计分规则</b><span>上限 +2 万</span></div>
      <div class="row"><span>现在每次答对</span><b id="rGain">+1</b></div>
      <div class="row"><span>答错一次</span><b id="rCost" class="neg">−10</b></div>
      <div class="row"><span>再连对 <i id="rNeed">10</i> 次</span><b id="rNext">+2</b></div>
    </div>

    <button class="resetlink" id="btnReset">重置全部进度</button>

    <div class="backuprow">
      <button class="linkbtn" id="btnExport" title="把进度存成一个小文件，换电脑后可导入">导出进度</button>
      <span class="dotsep">·</span>
      <button class="linkbtn" id="btnImport" title="从备份文件恢复进度（会覆盖当前进度）">导入进度</button>
    </div>
    <input type="file" id="fileIn" accept=".json,application/json" hidden>

    <div class="signature" title="五笔字根练习 · 86 版 · v1.0.6"><b>v1.0.6</b> <span class="by">by IHQI</span></div>
  </aside>
</main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   字根表（依据《86五笔字根图》晓览YMPA 2024.10.1 版整理）
   每项：[字根, 是否主字根]
   ============================================================ */
/* ---------- 25 键：区位 + 助记词（字根字形一律用图片，见 GLYPHS） ---------- */
const KEYS = [
  {k:'G', code:'11', zone:1, mn:'王旁青头戋五一'},
  {k:'F', code:'12', zone:1, mn:'土士二干十寸雨'},
  {k:'D', code:'13', zone:1, mn:'大犬三羊古石厂'},
  {k:'S', code:'14', zone:1, mn:'木丁西'},
  {k:'A', code:'15', zone:1, mn:'工戈草头右框七'},
  {k:'H', code:'21', zone:2, mn:'目具上止卜虎皮'},
  {k:'J', code:'22', zone:2, mn:'日早两竖与虫依'},
  {k:'K', code:'23', zone:2, mn:'口与川 字根稀'},
  {k:'L', code:'24', zone:2, mn:'田甲方框四车力'},
  {k:'M', code:'25', zone:2, mn:'山由贝 下框几'},
  {k:'T', code:'31', zone:3, mn:'禾竹一撇双人立 反文条头共三一'},
  {k:'R', code:'32', zone:3, mn:'白手看头三二斤'},
  {k:'E', code:'33', zone:3, mn:'月彡乃用家衣底 爱头豹脚舟字底'},
  {k:'W', code:'34', zone:3, mn:'人和八 祭登头'},
  {k:'Q', code:'35', zone:3, mn:'金勺缺点无尾鱼 犬旁留乂儿一点夕 氏无七'},
  {k:'Y', code:'41', zone:4, mn:'言文方广在四一 高头一捺谁人去'},
  {k:'U', code:'42', zone:4, mn:'立辛两点六门疒'},
  {k:'I', code:'43', zone:4, mn:'水旁兴头小倒立'},
  {k:'O', code:'44', zone:4, mn:'火业头 四点米'},
  {k:'P', code:'45', zone:4, mn:'之字军盖道建底 摘礻衤'},
  {k:'N', code:'51', zone:5, mn:'已半巳满不出己 左框折尸心和羽'},
  {k:'B', code:'52', zone:5, mn:'子耳了也框向上'},
  {k:'V', code:'53', zone:5, mn:'女刀九臼山朝西'},
  {k:'C', code:'54', zone:5, mn:'又巴马 丢矢矣'},
  {k:'X', code:'55', zone:5, mn:'慈母无心弓和匕 幼无力'},

/* ---------- 算法参数（照搬虎码源码） ---------- */
const POS_TABLE = {0:2, 1:4, 2:8, 3:12, 4:20, 5:30, 6:60, 7:100};   // 第 n 次答对 → 插回第几位
const TAIL_FROM = 8;             // 第 9 次起 → 队尾
/* 答错扣分：按「当时每次得分 × 5」，也就是恒等于连错 5 次的分。
   不设门槛，所以从第一题到最高等级，痛感比例一样。
   倍数不宜再高：10 倍时失误率只要过 8%，分数就基本涨不动了（新手期一直是 Lv1）。 */
const PENALTY_FACTOR = 5;

/* 连击阶梯（阈值 → 每对得分），用于界面显示「下一档还差几次」 */
const TP_STEPS = [[10,2],[20,4],[30,6],[40,10],[50,15],[100,20],[200,30],
                  [300,50],[500,100],[1000,1000],[2000,2000],[3000,3000],
                  [5000,10000],[10000,20000]];
function gainAt(c){ return TP(c + 2); }        // 下一次答对能得多少（answer() 里 combo 先 +1）
function nextGainAt(c){
  const cur = gainAt(c);
  for(const [t, g] of TP_STEPS){
    if(c >= t - 1) continue;
    if(g > cur) return { need:(t - 1) - c, gain:g };
  }
  return null;
}

function TP(combo){                    // 连击系数阶梯
  if(combo>10000) return 20000;
  if(combo>5000)  return 10000;
  if(combo>3000)  return 3000;
  if(combo>2000)  return 2000;
  if(combo>1000)  return 1000;
  if(combo>500)   return 100;
  if(combo>300)   return 50;
  if(combo>200)   return 30;
  if(combo>100)   return 20;
  if(combo>50)    return 15;
  if(combo>40)    return 10;
  if(combo>30)    return 6;
  if(combo>20)    return 4;
  if(combo>10)    return 2;
  return 1;
}
/* 50 级：等级名借鉴《英雄坛说》，积分阶梯借鉴《热血传奇》

const RANKS = [

  [1600,'初窥门径'],[2500,'初出茅庐'],[3700,'略知一二'],[5400,'普普通通'],[7900,'平平常常'],
  [13900,'平淡无奇'],[21900,'粗懂皮毛'],[31900,'半生不熟'],[46900,'登堂入室'],[76900,'略有小成'],
  [116900,'已有小成'],[166900,'鹤立鸡群'],[236900,'驾轻就熟'],[336900,'青出于蓝'],[456900,'融会贯通'],
  [596900,'心领神会'],[846900,'炉火纯青'],[1146900,'了然于胸'],[1496900,'略有大成'],[1896900,'已有大成'],
  [2396900,'豁然贯通'],[3096900,'非比寻常'],[4096900,'出类拔萃'],[5496900,'罕有敌手'],[7296900,'技冠群雄'],
  [9296900,'神乎其技'],[11696900,'出神入化'],[14496900,'傲视群雄'],[17696900,'登峰造极'],[21296900,'无与伦比'],

];
function rankOf(p){
  let r = RANKS[0][1];
  for(const [min,name] of RANKS){ if(p >= min) r = name; else break; }
  return r;
}
function rankIdx(p){
  let i = 0;
  for(let j = 0; j < RANKS.length; j++){ if(p >= RANKS[j][0]) i = j; else break; }
  return i;
}
function rankProgress(p){
  const i = rankIdx(p);
  const lo = RANKS[i][0];
  const nxt = RANKS[i+1] || null;
  const t = nxt ? Math.min(1, (p - lo) / (nxt[0] - lo)) : 1;
  return { i, lo, nxt, t };
}

/* 等级配色：每 5 级换一次，颜色随等级推进；最后一档墨底金字（返璞归真） */
const LV_TINT = [
  [6,  '#5F6673', '#F1F2F4'],   // Lv1–5     灰

function tintOf(lv){
  for(const [max, fg, bg] of LV_TINT) if(lv < max) return [fg, bg];
  return ['#EBC264', '#2F2C26'];
}

/* 积分缩写：一万以下原样，之上用「万 / 亿」，最多两位小数并去掉末尾 0
   注意 9999.999 万四舍五入后是 10000 万，要进位成「1亿」 */
function fmtScore(n){
  n = Math.max(0, Math.round(n || 0));
  if(n < 10000) return n.toLocaleString('en-US');
  const w = +(n / 1e4).toFixed(2);
  if(w < 10000) return w + '万';
  return +(n / 1e8).toFixed(2) + '亿';
}

/* ---------- 存档 ---------- */
const SAVE_KEY = 'wubi-roots-srs-v6';
const LEGACY_KEYS = ['wubi-roots-srs-v5', 'wubi-roots-srs-v4'];
const DEFAULTS = { points:0, combo:0, maxCombo:0, wrongs:0, showMn:true };

let pool = [];          // 236 张：211 个字根 + 25 个一简，交错排列
let queue = [];         // [{pi, count, failed}]
let points = 0, combo = 0, maxCombo = 0, wrongs = 0;
let showMn = true;
let locked = false;
let epoch = 0;          // 队列「世代号」：重置时 +1，作废还在排队中的答对回调

/* 建池：25 键轮流发牌，一简按固定间隔插进去
   目标：① 不连着按同一个键 ② 不连着打同一个区 ③ 每个键的主字根先出、变体后出 */
function buildPool(){
  /* 键序按「位优先」：G H T Y N / F J R U B / D K E I V / S L W O C / A M Q P X
     这样每 5 张正好走完横竖撇捺折各一次，不会出现「前 20 张全在横区」 */
  const order = KEYS.slice().sort((a, b) => {
    const pa = +a.code[1], pb = +b.code[1];
    return pa !== pb ? pa - pb : a.zone - b.zone;
  });

  /* si 仍按 KEYS 原顺序编号（与旧存档同一套），不跟着新排列变 */
  const base = {};
  let gi = 0;
  KEYS.forEach(km => {
    base[km.k] = gi;
    gi += (GLYPHS.root[km.k.toLowerCase()] || []).length;
  });

  const buckets = order.map(km => ({
    km,
    cards: (GLYPHS.root[km.k.toLowerCase()] || []).map((img, i) => ({ img, i }))
  }));

  /* 轮转发牌：第 r 轮从每个还有牌的键各取第 r 张，起点逐轮右移一位 */
  const out = [];
  const maxLen = buckets.reduce((m, b) => Math.max(m, b.cards.length), 0);
  for(let r = 0; r < maxLen; r++){
    for(let s = 0; s < buckets.length; s++){
      const b = buckets[(s + r) % buckets.length];
      const c = b.cards[r];
      if(!c) continue;
      out.push({
        img:c.img, key:b.km.k, code:b.km.code, zone:b.km.zone, mn:b.km.mn,
        src:'root', si: base[b.km.k] + c.i
      });
    }
  }

  /* 一简：同样按位优先排，这样插进去的区也是 1→5 轮转 */
  const jBase = {};
  let sj = 0;
  KEYS.forEach(km => {
    if(GLYPHS.yijian && GLYPHS.yijian[km.k.toLowerCase()]) jBase[km.k] = sj++;
  });
  const jians = order.filter(km => jBase[km.k] !== undefined).map(km => ({
    img:GLYPHS.yijian[km.k.toLowerCase()], key:km.k, code:km.code, zone:km.zone,
    mn:km.mn, src:'yijian', si:jBase[km.k], kind:'一级简码'
  }));

  /* 一简均匀撒开，大约每 9 张一张 */
  pool = [];
  const step = Math.max(1, Math.round(out.length / jians.length));
  let j = 0;
  for(let i = 0; i < out.length; i++){
    pool.push(out[i]);
    if(j < jians.length && (i + 1) % step === 0) pool.push(jians[j++]);
  }
  while(j < jians.length) pool.push(jians[j++]);

  /* 收尾：一简插进去可能和邻居撞键，就往后找个不同键的换过来 */
  for(let i = 1; i < pool.length; i++){
    if(pool[i].key !== pool[i-1].key) continue;
    for(let k = i + 1; k < pool.length; k++){
      if(pool[k].key !== pool[i-1].key){
        const t = pool[i]; pool[i] = pool[k]; pool[k] = t;
        break;
      }
    }
  }
}

function freshQueue(){
  return pool.map((_,i) => ({ pi:i, count:-1, failed:false }));
}
function identOf(p){
  return p.src + ':' + p.si;
}

/* 存档：不存索引，存每张卡的「身份」和「熟练度」。
   这样以后改排列顺序，进度也不会错位。 */
let saveWarned = false;
function save(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      order:  queue.map(it => identOf(pool[it.pi])),
      counts: queue.map(it => it.count),
      failed: queue.map(it => it.failed ? 1 : 0),
      points, combo, maxCombo, wrongs, showMn
    }));
  }catch(e){
    /* 存储被禁用 / 空间满：静默失败最伤人（打一晚全丢），所以提示一次 */
    if(!saveWarned){
      saveWarned = true;
      toast('进度保存失败：浏览器不允许本地存储');
    }
  }
}

/* 旧版排列（v5 的「字根按文件顺序 + 一简穿插」），只为把老存档的进度捞回来 */
function legacyV5Order(){
  const roots = [], jians = [];
  let gi = 0, sj = 0;
  KEYS.forEach(km => {
    (GLYPHS.root[km.k.toLowerCase()] || []).forEach(() => roots.push('root:' + (gi++)));
    if(GLYPHS.yijian && GLYPHS.yijian[km.k.toLowerCase()]) jians.push('yijian:' + (sj++));
  });
  const n = roots.length, m = jians.length;
  const out = [];
  let j = 0;
  for(let i = 0; i < n; i++){
    out.push(roots[i]);
    if(j < m && (i + 1) >= Math.round((j + 1) * n / (m + 1))) out.push(jians[j++]);
  }
  while(j < m) out.push(jians[j++]);
  return out;
}

/* 老格式存档 → 身份 → 熟练度 */
function legacyCounts(raw){
  const m = new Map();
  const put = (id, it) => { if(id) m.set(id, { c: safeInt(it.count, -1, -1), f: !!it.failed }); };

  if(Array.isArray(raw.queue)){          // v5：单一队列，pi 指向当时那套排列
    const v5 = legacyV5Order();
    for(const it of raw.queue){
      if(it && Number.isInteger(it.pi)) put(v5[it.pi], it);
    }
  }
  if(raw.queues){                        // v4 及更早：字根 / 一简 两个池
    for(const it of (raw.queues.root || [])){
      if(it && Number.isInteger(it.pi)) put('root:' + it.pi, it);
    }
    for(const it of (raw.queues.yijian || [])){
      if(it && Number.isInteger(it.pi)) put('yijian:' + it.pi, it);
    }
  }
  return m;
}

/* 存档里的整数一律走这里：不用 `|0`。
   `|0` 是 32 位截断，2000 分以下看不出来，但 21.5 亿以上会翻负——而 Lv50 要 18.2 亿，
   正好在射程内，一旦溢出，满级玩家刷新一次页面分数就归零。 */
function safeInt(v, fallback, min, max){
  const n = Math.floor(Number(v));
  if(!Number.isFinite(n)) return fallback === undefined ? 0 : fallback;
  let r = n;
  if(min !== undefined && r < min) r = min;
  if(max !== undefined && r > max) r = max;
  return r;
}

function load(){
  buildPool();
  let raw = null;
  for(const key of [SAVE_KEY, ...LEGACY_KEYS]){
    try{ raw = JSON.parse(localStorage.getItem(key) || 'null'); }catch(e){ raw = null; }
    if(raw) break;
  }
  const s = Object.assign({}, DEFAULTS, raw || {});
  points = safeInt(s.points, 0, 0);          // 负数归零，但不再被 32 位截断
  combo = safeInt(s.combo, 0, 0);
  maxCombo = safeInt(s.maxCombo, 0, 0);
  wrongs = safeInt(s.wrongs, 0, 0);
  showMn = s.showMn !== false;

  const idx = new Map(pool.map((p, i) => [identOf(p), i]));
  const failedAt = i => !!(Array.isArray(raw && raw.failed) && raw.failed[i]);

  /* 按 order+counts 成对还原：跳过未知身份和重复身份，能救多少救多少。
     不能因为「有一个 id 坏了」就把整套熟练度丢掉——那是静默的数据损失。 */
  const seen = new Set();
  const restored = [];
  if(raw && Array.isArray(raw.order) && Array.isArray(raw.counts)){
    for(let i = 0; i < raw.order.length && i < raw.counts.length; i++){
      const pi = idx.get(raw.order[i]);
      if(pi === undefined || seen.has(pi)) continue;
      const c = raw.counts[i];
      seen.add(pi);
      restored.push({
        pi,
        count: safeInt(c, -1, -1),                     // 该位没有数字就当新卡，别当成答对过
        failed: failedAt(i)
      });
    }
  }

  /* 完好 → 连队列顺序一起还原（正常情况都走这里） */
  if(restored.length === pool.length){ queue = restored; return; }

  /* 部分损坏 / 老存档 → 已救回的排在前面，其余按熟练度表补到队尾 */
  const known = legacyCounts(raw || {});
  queue = restored;
  for(let i = 0; i < pool.length; i++){
    if(seen.has(i)) continue;
    const it = { pi:i, count:-1, failed:false };
    const k = known.get(identOf(pool[i]));
    if(k){ it.count = k.c; it.failed = k.f; }
    queue.push(it);
  }
}

/* ---------- 核心：答对 → 插回第 N 位 ---------- */
function advance(){
  const item = queue.shift();
  item.count += 1;                       // 新 count
  item.failed = false;
  const r = item.count;
  const pos = r >= TAIL_FROM ? queue.length : Math.min(POS_TABLE[r] ?? queue.length, queue.length);
  queue.splice(pos, 0, item);
}

function answer(key){
  if(locked) return;
  /* Z 是五笔的万能键，不指向任何字根，按它既不该算对也不该算错（更不该扣分）。
     键盘上它标着「万能」，如果按了直接判错，就等于界面说一套、行为做一套。 */
  if(key === 'Z'){
    toast('Z 是万能键，不参与字根练习');
    return;
  }
  const cur = queue[0];
  const right = pool[cur.pi].key;
  if(key === right){
    // 答对：先亮灯，110ms 后再计分＋推进（分数与队列同进同退，不会一边涨一边没动）
    flashKey(key, 'correct');
    locked = true;
    const ep = epoch;                       // 记住这一答属于哪一代队列
    setTimeout(()=>{
      /* 先判代，再解锁。顺序反了会出事：重置后新题已经 locked=true 在等 110ms，
         而旧回调到期时会把新题的锁解开，于是快速连按同一个键能算两次分。 */
      if(ep !== epoch) return;              // 这 110ms 里点过「重置」或导入，这次答对作废
      locked = false;
      combo += 1;
      maxCombo = Math.max(maxCombo, combo);
      points += 1 * TP(combo + 1);
      advance();
      render();
      save();
    }, 110);
  } else {
    // 答错：清零 + 原地重来（题目留在队首，一步都不往后挪）
    const prevCombo = combo;
    cur.count = -1;
    cur.failed = true;
    const deduct = Math.min(gainAt(prevCombo) * PENALTY_FACTOR, points);   // 扣到 0 为止，不出负数
    if(deduct > 0) points -= deduct;
    combo = 0;
    wrongs += 1;
    flashKey(key, 'wrong');
    flashKey(right, 'correct');
    render();
    if(deduct > 0) flashPen(deduct);      // 放在 render 之后，否则会被「还差多少分」覆盖
    save();
  }
}

/* ---------- 渲染 ---------- */
const $ = id => document.getElementById(id);
let penTimer = null, penActive = false;      // 扣分提示的定时器与状态（render 会读 penActive）

function renderKeyboard(){
  const kb = $('kb');
  if(kb.childElementCount) return;
  const rows = [
    ['Q','W','E','R','T','Y','U','I','O','P'],
    ['A','S','D','F','G','H','J','K','L'],
    ['Z','X','C','V','B','N','M'],
  ];
  const byKey = {};
  KEYS.forEach(km => byKey[km.k] = km);
  rows.forEach((row, ri)=>{
    const r = document.createElement('div');
    r.className = 'kbrow';
    if(ri===1) r.style.marginLeft = '39px';
    if(ri===2) r.style.marginLeft = '78px';
    row.forEach(k=>{
      const km = byKey[k];
      const el = document.createElement('div');
      el.className = 'key ' + (km ? 'z'+km.zone : 'dim');
      el.dataset.k = k;
      el.innerHTML = '<span>'+k+'</span><em>'+(km?km.code:'万能')+'</em>';
      el.addEventListener('click', ()=>answer(k));
      r.appendChild(el);
    });
    kb.appendChild(r);
  });
}

function flashKey(k, cls){
  const el = document.querySelector('.key[data-k="'+k+'"]');
  if(!el) return;
  el.classList.add(cls);
  const dur = cls === 'wrong' ? 420 : 160;
  setTimeout(()=>el.classList.remove(cls), dur);
}

function render(){
  const cur = queue[0];
  if(!cur) return;
  const p = pool[cur.pi];
  const total = queue.length;
  const doneCount = queue.filter(it=>it.count >= 0).length;

  // 题目
  $('glyph').src = 'data:image/png;base64,' + p.img;   // 复用同一个 img：换 src 能命中解码缓存，比重建节点更稳
  $('card').classList.toggle('bad', cur.count < 0 && cur.failed);   // 只有真答错才变粉；新卡不加告警色
  const showCode = cur.count < 0;                   // 第一次遇到 / 刚打错 → 给答案
  $('answerline').textContent = showCode ? ('正确键位  ' + p.code + '  ' + p.key) : '';
  $('mnemonic').textContent = showMn
    ? ('助记　' + p.mn + (p.kind ? '　·　' + p.kind : ''))
    : '';
  $('slot').textContent = showCode ? p.key : '_';
  $('slot').classList.toggle('ok', showCode);
  $('slothint').textContent = showCode
    ? '这是新卡或刚打错，跟着打一遍'
    : '按下它所在的字母键';

  // 进度
  $('qPos').textContent = doneCount;
  $('qTotal').textContent = total;
  $('qWrong').textContent = wrongs;
  $('progressBar').style.width = Math.round(doneCount / total * 100) + '%';

  // 顶栏 / 右栏
  const rp = rankProgress(points);
  const lv = rp.i + 1;
  const rkName = RANKS[rp.i][1];

  $('hRankText').textContent = 'Lv' + lv + ' ' + rkName;
  $('hPoints').textContent = points.toLocaleString('en-US');   // 顶栏给完整数字
  $('hCombo').textContent = combo;

  $('pPoints').textContent = fmtScore(points);                 // 面板用「万 / 亿」缩写
  $('pLv').textContent = 'Lv' + lv;
  $('pRank').textContent = rkName;
  const [rkFg, rkBg] = tintOf(lv);
  $('rankChip').style.color = rkFg;
  $('rankChip').style.background = rkBg;

  $('pct').textContent = rp.nxt ? Math.round(rp.t * 100) + '%' : '顶级';
  $('pTrack').style.width = (rp.t * 100).toFixed(1) + '%';
  if(!penActive){                                   // 扣分提示展示期间不去覆盖它
    $('pNote').textContent = rp.nxt
      ? ('还差 ' + fmtScore(rp.nxt[0] - points) + '分，到 Lv' + (rp.i + 2) + ' ' + rp.nxt[1])
      : '已是最高等级，继续累积就行';
    $('pNote').style.color = '';
    $('pNote').style.fontWeight = '';
  }
  markRankMenu(rp.i);

  $('sDone').textContent = doneCount;
  $('sNew').textContent = total - doneCount;
  $('qLeft').textContent = total + ' 个';

  // 计分规则（全部用实时数字说，不堆文字）
  const gain = gainAt(combo);
  $('rGain').textContent = '+' + gain.toLocaleString('en-US');
  $('rCost').textContent = '−' + (gain * PENALTY_FACTOR).toLocaleString('en-US');
  const ng = nextGainAt(combo);
  if(ng){
    $('rNeed').textContent = ng.need.toLocaleString('en-US');
    $('rNext').textContent = '+' + ng.gain.toLocaleString('en-US');
  } else {
    $('rNeed').textContent = '—';
    $('rNext').textContent = '已最高';
  }

  $('mnState').textContent = showMn ? '开' : '关';
  $('mnemonicToggle').classList.toggle('off', !showMn);
}

/* ---------- 等级菜单 ---------- */
function buildRankMenu(){
  const m = $('rankMenu');
  m.innerHTML = '<div class="rmhead"><span>等级</span><span>起始积分</span></div>' +
    RANKS.map(([min,name],i)=>
      '<div class="rrow" data-i="'+i+'" role="menuitem">'+
        '<span><em>Lv'+(i+1)+'</em>'+name+'</span>'+
        '<span class="need">'+fmtScore(min)+'</span>'+

}
function markRankMenu(i){
  const m = $('rankMenu');
  if(!m || !m.querySelectorAll) return;
  for(const el of m.querySelectorAll('.rrow')){
    el.classList.toggle('cur', Number(el.dataset.i) === i);
  }
}
function setRankMenu(open){
  const m = $('rankMenu');
  m.classList.toggle('show', open);
  $('rankBtn').setAttribute('aria-expanded', open ? 'true' : 'false');
  if(open){
    const cur = m.querySelector && m.querySelector('.rrow.cur');
    if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'center'});
  }
}

let toastTimer;
function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
}

function flashPen(n){
  const el = $('pNote');
  if(!el) return;
  penActive = true;
  el.textContent = '答错 −' + n.toLocaleString('en-US') + ' 分';
  el.style.color = 'var(--bad)';
  el.style.fontWeight = '600';
  clearTimeout(penTimer);
  penTimer = setTimeout(()=>{
    penActive = false;
    el.style.color = '';
    el.style.fontWeight = '';
    render();
  }, 1300);
}

/* ---------- 进度备份：导出 / 导入 ---------- */
const BACKUP_FORMAT = 1;
const BACKUP_APP = '五笔字根练习';

function exportProgress(){
  save();                                   // 先落盘，保证导出的是最新状态
  let raw = null;
  try{ raw = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); }catch(e){ raw = null; }
  if(!raw){ toast('还没有可导出的进度'); return; }

  const pack = {
    app: BACKUP_APP,
    edition: '86',
    format: BACKUP_FORMAT,
    exportedAt: new Date().toISOString(),
    data: raw
  };
  const d = new Date();
  const stamp = d.getFullYear()
    + String(d.getMonth() + 1).padStart(2, '0')
    + String(d.getDate()).padStart(2, '0');
  const name = '五笔字根进度_' + stamp + '.json';

  try{
    const blob = new Blob([JSON.stringify(pack, null, 1)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast('已导出 ' + name);
  }catch(e){
    toast('导出失败：浏览器拦下了下载');
  }
}

/* 返回 Promise：完成（或失败）后 resolve，方便串接与测试 */
function importProgress(file){
  return new Promise(resolve => {
    const r = new FileReader();
    r.onload = () => {
      let pack = null;
      try{ pack = JSON.parse(String(r.result)); }
      catch(e){ toast('导入失败：文件不是有效的 JSON'); resolve(false); return; }

      const data = (pack && pack.data) ? pack.data : pack;      // 也接受裸存档
      if(!data || !Array.isArray(data.order) || !Array.isArray(data.counts)){
        toast('导入失败：不是这个工具的进度文件');
        resolve(false); return;
      }

      const n = data.order.length;
      const fpts = (typeof data.points === 'number') ? fmtScore(data.points) + ' 分' : '未知分数';
      if(!confirm('导入会覆盖当前进度。\n\n文件里：' + n + ' 张 · ' + fpts
          + '\n现在：  ' + queue.length + ' 张 · ' + fmtScore(points) + ' 分\n\n继续？')){
        resolve(false); return;
      }

      try{
        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      }catch(e){
        toast('导入失败：无法写入本地存储');
        resolve(false); return;
      }

      epoch++;                 // 和「重置」同样处理：作废排队中的答对回调
      locked = false;
      clearTimeout(penTimer);
      penActive = false;

      load();                  // 重新从存档恢复（内部会校验长度与身份）
      render();

      if(n !== queue.length){
        toast('已导入，但格式不同：文件 ' + n + ' 张 → 现存 ' + queue.length + ' 张，只恢复了能对上的部分');
      }else{
        toast('已导入：' + fmtScore(points) + ' 分 · ' + rankOf(points));
      }
      resolve(true);
    };
    r.onerror = () => { toast('导入失败：读不了这个文件'); resolve(false); };
    r.readAsText(file);
  });
}

/* ---------- 交互 ---------- */
window.addEventListener('keydown', e=>{
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.repeat) return;                       // 长按不重复触发，否则按住错键会连续扣分
  const k = e.key.toUpperCase();
  if(/^[A-Z]$/.test(k)){
    e.preventDefault();
    answer(k);
  }
});

$('btnReset').addEventListener('click', ()=>{
  if(!confirm('重置全部进度？分数、连击、队列都会清空。')) return;
  epoch++;                         // 作废排队中的答对回调，防止它推进刚重置的队列
  locked = false;
  clearTimeout(penTimer);
  penActive = false;
  points = 0; combo = 0; maxCombo = 0; wrongs = 0;
  queue = freshQueue();
  render(); save();
  toast('已重置');
});
$('btnExport').addEventListener('click', exportProgress);
$('btnImport').addEventListener('click', ()=>$('fileIn').click());
$('fileIn').addEventListener('change', e=>{
  const f = e.target.files && e.target.files[0];
  if(f) importProgress(f);
  e.target.value = '';            // 清空，这样同一个文件能再选一次
});

$('mnemonicToggle').addEventListener('click', ()=>{
  showMn = !showMn;
  render(); save();
});

$('rankBtn').addEventListener('click', e=>{
  e.stopPropagation();
  setRankMenu(!$('rankMenu').classList.contains('show'));
});
$('rankMenu').addEventListener('click', e=>e.stopPropagation());
document.addEventListener('click', ()=>setRankMenu(false));
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') setRankMenu(false); });

/* ---------- 启动 ---------- */
load();
renderKeyboard();
buildRankMenu();
render();
</script>
